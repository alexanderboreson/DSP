[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodsp-studio"
version = "0.1.0"
description = "Lokal DSP- och kalibreringsapplikation (Fas 1: MVP)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "PyQt6>=6.6",
    "pyqtgraph>=0.13.3",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
autodsp = "autodsp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
